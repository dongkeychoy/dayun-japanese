<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5F7FF" />
    <meta
      name="description"
      content="다윤이의 일본어 미션. DAY 01 行く. 7가지 활용형과 생활 문장, 오늘의 단어 5개를 배우는 일본어 학습장."
    />
    <title>다윤이의 일본어 미션 · DAY 01</title>

    <link rel="stylesheet" href="./study.css?v=6" />
  </head>
  <body>
    <div class="phone" id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">は</span>
          <div>
            <strong>다윤이의 일본어 미션</strong
            ><span class="brand-sub">하루 한 단어 · 차근차근</span>
          </div>
        </div>
        <div class="top-actions">
          <button
            id="level-open"
            class="level-pill"
            type="button"
            aria-label="학습 레벨 바꾸기"
          >
            LV.1 <span aria-hidden="true">⌄</span></button
          ><button
            id="sound-toggle"
            class="icon-button"
            type="button"
            aria-label="효과음 끄기"
            aria-pressed="true"
          >
            <span id="sound-icon">♫</span>
          </button>
        </div>
      </header>
      <div class="hero" aria-label="오늘의 일본어 단어">
        <div class="hero-copy">
          <div class="hero-day">
            <button id="day-label" type="button" aria-label="학습 날짜 선택">
              DAY 01</button
            ><span class="day-star">★</span> 오늘의 동사
          </div>
          <div class="hero-word" id="hero-word" lang="ja">行く</div>
          <div class="hero-meaning">
            <span id="hero-kana" lang="ja">いく</span
            ><span class="hero-dot">·</span><span id="hero-ko">가다</span>
          </div>
          <button id="hero-speak" class="listen-hero" type="button">
            <span aria-hidden="true">▶</span> 발음 듣기
          </button>
        </div>
        <div class="hero-illustration">
          <img
            id="hero-image"
            src="./images/walking-girl.webp"
            alt="사용자가 제공한 걷는 여자아이"
          /><span class="hero-spark" aria-hidden="true">✦</span>
        </div>
      </div>
      <nav class="tabbar" aria-label="학습 모드" role="tablist">
        <button
          id="tab-train"
          data-tab="train"
          role="tab"
          aria-selected="true"
          class="tab active"
          type="button"
        >
          <span class="tab-ico">✦</span><span>훈련</span>
        </button>
        <button
          id="tab-sentence"
          data-tab="sentence"
          role="tab"
          aria-selected="false"
          class="tab"
          type="button"
        >
          <span class="tab-ico">あ</span><span>문장</span>
        </button>
        <button
          id="tab-word"
          data-tab="word"
          role="tab"
          aria-selected="false"
          class="tab"
          type="button"
        >
          <span class="tab-ico">▧</span><span>오늘의 단어</span>
        </button>
        <button
          id="tab-quiz"
          data-tab="quiz"
          role="tab"
          aria-selected="false"
          class="tab"
          type="button"
        >
          <span class="tab-ico">★</span><span>퀴즈</span>
        </button>
      </nav>
      <main
        class="workspace"
        id="workspace"
        role="tabpanel"
        aria-live="polite"
      ></main>
      <footer class="footbar">
        <div class="foot-info">
          <span class="status-dot"></span
          ><span id="footer-status">오늘은 7가지 활용형을 익혀요</span>
        </div>
        <button id="dad-open" type="button" class="dad-button">
          아빠 점검 <span aria-hidden="true">›</span>
        </button>
      </footer>
      <div class="fx-layer" id="fx-layer" aria-hidden="true"></div>
      <div id="toast" role="status" aria-live="polite" class="toast"></div>
    </div>
    <dialog id="day-dialog" class="modal">
      <div class="modal-header">
        <h2>오늘의 학습 카드</h2>
        <button
          type="button"
          class="close-modal"
          data-close="day-dialog"
          aria-label="닫기"
        >
          ×
        </button>
      </div>
      <p>배웠던 카드를 다시 열어 복습할 수 있어요.</p>
      <div class="level-options" id="day-options"></div>
    </dialog>
    <dialog id="level-dialog" class="modal">
      <div class="modal-header">
        <h2>학습 레벨 선택</h2>
        <button
          type="button"
          class="close-modal"
          data-close="level-dialog"
          aria-label="닫기"
        >
          ×
        </button>
      </div>
      <p>
        7가지 동사 변화형은 모든 레벨에서 보여요. 기본 학습부터 천천히 연습해요.
      </p>
      <div class="level-options">
        <button type="button" data-level="1">
          <b>LEVEL 1</b><span>7가지 활용형 · 처음부터 천천히</span></button
        ><button type="button" data-level="2">
          <b>LEVEL 2</b><span>7가지 활용형 · 한 번 더 복습</span></button
        ><button type="button" data-level="3">
          <b>LEVEL 3</b><span>7가지 활용형 · 자신 있게 말하기</span>
        </button>
      </div>
      <p class="modal-caption">
        레벨 설정과 점수는 이 휴대폰 브라우저에만 저장됩니다.
      </p>
    </dialog>
    <dialog id="dad-dialog" class="modal">
      <div class="modal-header">
        <h2>오늘 밤 아빠 점검</h2>
        <button
          type="button"
          class="close-modal"
          data-close="dad-dialog"
          aria-label="닫기"
        >
          ×
        </button>
      </div>
      <p>정답을 보지 않고 일본어로 말해 보세요.</p>
      <div class="parent-questions" id="parent-questions"></div>
      <button id="dad-complete" class="primary-wide" type="button">
        아빠, 오늘 미션 확인!
      </button>
      <p class="modal-caption">아빠의 확인은 이 기기의 학습장에만 남아요.</p>
    </dialog>
    <script type="module" src="./runtime.js?v=6"></script>
  </body>
</html>
